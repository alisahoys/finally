# Render Blueprint: one free Docker web service, no disk, simulator market data.
# MASSIVE_API_KEY is left unset, which selects the simulator.
services:
  - type: web
    name: finally
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # Render asks for the value when the Blueprint is created
