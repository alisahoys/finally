# Run: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
services:
  finally:  # Not "app": Chromium forces HTTPS on the .app TLD via HSTS preload.
    build: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
    tmpfs:
      - /app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 1s
      timeout: 2s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      finally:
        condition: service_healthy
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    working_dir: /e2e
    volumes:
      - .:/e2e
      - /e2e/node_modules
    command: sh -c "npm ci && npx playwright test"
